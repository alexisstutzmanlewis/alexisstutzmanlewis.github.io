    <h1 class="page-title">Get in touch</h1>
    <p class="lede" style="margin-top:24px;">Have a question, a collaboration idea, or just want to say hello? Send a message below, or find me on LinkedIn.</p>

    <!-- TODO: sign up free at https://formspree.io, create a form, and replace YOUR_FORM_ID below -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn">Send message</button>
    </form>

    <p style="margin-top:48px;"><a href="#" id="linkedin-link" class="arrow-link" target="_blank" rel="noopener">Find me on LinkedIn &rarr;</a></p>
  </section>
