<main>
  <section style="padding-top:130px;">
    <p class="eyebrow">Let's connect</p>
    <h1 style="font-family:var(--font-heading); font-size:2rem; margin:14px 0 12px;">Get in touch</h1>
    <p class="body-copy muted" style="margin-bottom:36px;">Have a question, collaboration idea, or just want to say hello? Send a message below, or find me on LinkedIn.</p>

    <!-- TODO: sign up free at https://formspree.io, create a form, and replace YOUR_FORM_ID below -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn-primary" style="align-self:flex-start;">Send message</button>
    </form>

    <div class="cta-row" style="margin-top:40px;">
      <a href="#" id="linkedin-link" class="btn-ghost" target="_blank" rel="noopener">LinkedIn &rarr;</a>
    </div>
  </section>
</main>

<script>
  fetch('data/contact.json').then(r => r.json()).then(c => {
    const link = document.getElementById('linkedin-link');
    if (link && c.linkedinUrl) link.href = c.linkedinUrl;
  });
</script>
